<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon-light.svg" type="image/svg+xml" data-theme-icon />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Onesh" />
    <title>Onesh — Habits & Reading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('onesh-theme-mode') || 'auto'
          var hour = new Date().getHours()
          var resolved =
            mode === 'light' ? 'light' : mode === 'dark' ? 'dark' : hour >= 6 && hour < 19 ? 'light' : 'dark'
          document.documentElement.dataset.theme = resolved
          document.documentElement.dataset.themeMode = mode
          var icon = document.querySelector('link[data-theme-icon]')
          if (icon) icon.setAttribute('href', resolved === 'dark' ? '/favicon-dark.svg' : '/favicon-light.svg')
          var themeMeta = document.querySelector('meta[name="theme-color"]')
          if (themeMeta) themeMeta.setAttribute('content', resolved === 'dark' ? '#0b1220' : '#f6f7f9')
          var lang = localStorage.getItem('onesh-lang') || 'en'
          if (lang !== 'fr' && lang !== 'ar') lang = 'en'
          document.documentElement.lang = lang
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'
          document.documentElement.dataset.lang = lang
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
